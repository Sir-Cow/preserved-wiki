site_name: Preserved
site_url: https://sir-cow.github.io/preserved-wiki/
site_description: |
  Preserved mod set documentation.

repo_name: Sir-Cow/preserved-wiki
repo_url: https://github.com/Sir-Cow/preserved-wiki
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Inferno:
    - Overview: inferno/overview.md
    - Angling Table: inferno/angling_table.md
    - Cache: inferno/cache.md
    - Copper Trident: inferno/copper_trident.md
    - Multitool: inferno/multitool.md
    - Rhyolite: inferno/rhyolite.md
    - Sparkling Blackstone: inferno/sparkling_blackstone.md

theme:
  name: material
  favicon: img/favicon.ico

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode